[package]
name = "forge-sdp"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }
# The SDP crate of siphon-rs, from crates.io; `package` keeps the `sip_sdp`
# name the code uses.
sip-sdp = { package = "siphon-sdp", version = "0.3.2" }
smol_str = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = "0.23"
rand = { workspace = true }
forge-ice = { path = "../forge-ice", optional = true }

[features]
forge-ice = ["dep:forge-ice"]

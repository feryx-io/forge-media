[package]
name = "forge-sip-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Siphon SIP stack, from crates.io. The crates were renamed `sip-*` ->
# `siphon-*` when they were published; `package` keeps the `sip_*` names the
# code uses.
sip-core = { package = "siphon-core", version = "0.7.8" }
sip-parse = { package = "siphon-parse", version = "0.4.0" }
sip-transport = { package = "siphon-transport", version = "0.7.2" }
sip-uas = { package = "siphon-uas", version = "0.5.2" }
sip-sdp = { package = "siphon-sdp", version = "0.3.2" }

# Forge test daemon (for ForgeClient)
forge-test-daemon = { path = "../forge-test-daemon" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
bytes = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
